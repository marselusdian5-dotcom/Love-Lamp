<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Pull Lamp Animation</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.6)) drop-shadow(0 0 50px rgba(244, 63, 94, 0.4));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.8)) drop-shadow(0 0 70px rgba(244, 63, 94, 0.6));
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0px) scale(0.6);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-80px) scale(1.2);
                opacity: 0;
            }
        }

        .heart-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: floatUp 1.5s infinite ease-out;
        }

        /* Cord pulling physics transition */
        #pullSwitch {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        #pullSwitch.pulling {
            transform: translateY(28px);
        }

        /* Lamp bulb glow */
        .lamp-on {
            background-color: #fef08a !important;
            box-shadow: 0 0 40px 15px rgba(253, 224, 71, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.9);
        }
        .wire-glow {
            box-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
        }
    </style>
</head>
<body class="bg-[#121118] text-white h-screen w-screen flex flex-col justify-between items-center relative select-none overflow-hidden">

    <!-- Top Watermark / Title -->
    <div class="absolute top-6 left-6 tracking-widest text-xs font-semibold text-rose-300/70 uppercase">
        MARSELUS DEV • ROMANTIC EDITION
    </div>

    <!-- Scene Container -->
    <div id="scene" class="flex flex-col items-center relative mt-4 transition-all duration-700">
        
        <!-- Ceiling Mount -->
        <div class="w-12 h-2 bg-neutral-700 rounded-t-md shadow-md"></div>

        <!-- Upper Wire -->
        <div class="w-0.5 h-36 bg-neutral-600 transition-colors duration-500" id="upperWire"></div>

        <!-- Lamp Shade -->
        <div class="relative flex flex-col items-center z-20">
            <div class="w-32 h-14 bg-neutral-900 rounded-t-full border-b-2 border-neutral-700 shadow-xl flex justify-center items-end pb-1">
                <!-- Lamp Bulb -->
                <div id="bulb" class="w-10 h-10 rounded-full bg-neutral-700 shadow-inner transition-all duration-300"></div>
            </div>
        </div>

        <!-- Lower Cord (Pull Switch) -->
        <div class="relative flex flex-col items-center">
            <div class="w-0.5 h-20 bg-neutral-500" id="lowerWire"></div>
            <!-- Pull Handle -->
            <div id="pullSwitch" class="w-4 h-9 bg-amber-500/90 rounded-full shadow-lg border border-amber-300/50 flex justify-center items-start pt-1 cursor-pointer hover:bg-amber-400">
                <div class="w-1.5 h-3 bg-amber-200/60 rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Central Romantic Element (Hidden by default, shown when lamp is on) -->
    <div id="loveContainer" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none opacity-0 transition-opacity duration-700 z-10">
        <!-- Glowing Ambient Lines -->
        <div class="absolute flex gap-16 opacity-30">
            <div class="w-0.5 h-48 bg-gradient-to-b from-transparent via-rose-500 to-transparent"></div>
            <div class="w-0.5 h-48 bg-gradient-to-b from-transparent via-rose-500 to-transparent"></div>
        </div>

        <!-- Heart Icon with Sparkles -->
        <div class="relative flex items-center justify-center">
            <div class="text-7xl heart-glow select-none filter drop-shadow-[0_0_25px_rgba(244,63,94,0.8)]">
                ❤️
            </div>
            <!-- Floating Mini Sparkles -->
            <div class="absolute -top-4 -right-4 text-rose-300 animate-pulse text-lg">✨</div>
            <div class="absolute -bottom-2 -left-4 text-pink-400 animate-ping text-xs">💖</div>
        </div>
    </div>

    <!-- Bottom Hint Footer -->
    <div class="absolute bottom-8 text-neutral-400 text-xs tracking-wider font-light transition-opacity duration-300" id="hintText">
        Pull cord to switch on
    </div>

    <!-- Audio / FX Script -->
    <script>
        const scene = document.getElementById('scene');
        const pullSwitch = document.getElementById('pullSwitch');
        const bulb = document.getElementById('bulb');
        const upperWire = document.getElementById('upperWire');
        const lowerWire = document.getElementById('lowerWire');
        const loveContainer = document.getElementById('loveContainer');
        const hintText = document.getElementById('hintText');

        let isOn = false;
        let animating = false;

        // Sound effect helper (Web Audio API subtle click sound)
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch(e) {
                // Ignore audio context restriction errors if any
            }
        }

        pullSwitch.addEventListener('click', () => {
            if (animating) return;
            animating = true;

            playClickSound();
            pullSwitch.classList.add('pulling');
            isOn = !isOn;
            pullSwitch.setAttribute('aria-pressed', String(isOn));
            hintText.textContent = isOn ? 'Pull again to switch off' : 'Pull cord to switch on';

            window.setTimeout(() => {
                pullSwitch.classList.remove('pulling');
                
                if (isOn) {
                    bulb.classList.add('lamp-on');
                    upperWire.classList.add('wire-glow');
                    lowerWire.classList.add('wire-glow');
                    loveContainer.style.opacity = '1';
                    document.body.style.backgroundColor = '#1a1018'; // Slight warm romantic tint
                } else {
                    bulb.classList.remove('lamp-on');
                    upperWire.classList.remove('wire-glow');
                    lowerWire.classList.remove('wire-glow');
                    loveContainer.style.opacity = '0';
                    document.body.style.backgroundColor = '#121118';
                }

                animating = false;
            }, 150);
        });

        // Create dynamic background floating sparkles when active
        setInterval(() => {
            if (!isOn) return;
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const size = Math.random() * 4 + 2;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${window.innerWidth / 2 + (Math.random() * 120 - 60)}px`;
            sparkle.style.top = `${window.innerHeight / 2 + 40}px`;
            sparkle.style.animationDuration = `${Math.random() * 1 + 1}s`;
            
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1500);
        }, 300);
    </script>
</body>
</html>
