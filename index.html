<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Pull Lamp Animation</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.6)) drop-shadow(0 0 50px rgba(244, 63, 94, 0.4));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.8)) drop-shadow(0 0 70px rgba(244, 63, 94, 0.6));
            }
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.2);
                opacity: 0;
            }
        }

        .heart-float {
            position: absolute;
            animation: floatHeart 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        .lamp-glow {
            transition: all 0.5s ease;
        }

        .scene-dark {
            background: radial-gradient(circle at center, #1e1b2e 0%, #0d0b14 100%);
        }

        .scene-light {
            background: radial-gradient(circle at center, #362f4a 0%, #171424 100%);
        }

        /* Cord pull effect */
        .cord {
            transform-origin: top center;
            transition: transform 0.1s ease;
        }

        .pulling .cord {
            transform: scaleY(1.15);
        }
    </style>
</head>
<body id="scene" class="scene-dark w-screen h-screen flex flex-col items-center justify-between relative text-white">

    <div class="absolute top-6 left-6 text-xs tracking-widest text-pink-300 font-semibold opacity-70">
        KHIZI DEV • ROMANTIC EDITION
    </div>

    <div class="flex-1 flex flex-col items-center justify-center relative w-full max-w-md">
        
        <!-- Hanging Lamp Structure -->
        <div class="absolute top-0 flex flex-col items-center">
            <!-- Ceiling anchor -->
            <div class="w-16 h-2 bg-neutral-700 rounded-full shadow-md"></div>
            <!-- Wire -->
            <div id="lampWire" class="w-0.5 h-36 bg-gradient-to-b from-neutral-600 to-amber-200/50 cord"></div>
            
            <!-- Lamp Fixture & Bulb -->
            <div class="relative flex flex-col items-center group cursor-pointer" id="lampBulbContainer">
                <!-- Lamp Hood -->
                <div class="w-16 h-8 bg-gradient-to-b from-neutral-700 to-neutral-900 rounded-t-full border-b border-amber-500/30 shadow-lg"></div>
                <!-- Bulb -->
                <div id="lightBulb" class="w-10 h-12 rounded-full bg-neutral-800 border border-neutral-600 shadow-inner flex items-center justify-center transition-all duration-500 relative">
                    <!-- Filament / Inner Glow -->
                    <div id="bulbFilament" class="w-4 h-6 rounded-full bg-neutral-600 transition-all duration-500"></div>
                </div>

                <!-- Pull switch cord dangling from bulb -->
                <div class="flex flex-col items-center mt-[-4px]">
                    <div class="w-0.5 h-20 bg-neutral-400/80 cord"></div>
                    <!-- Pull handle -->
                    <div id="pullSwitch" class="w-4 h-8 bg-gradient-to-b from-amber-400 to-amber-600 rounded-full shadow-lg cursor-pointer hover:scale-110 active:scale-95 transition-transform flex items-center justify-center">
                        <div class="w-1.5 h-3 bg-amber-200 rounded-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Central Romantic Heart Animation Area -->
        <div id="heartContainer" class="mt-48 flex flex-col items-center opacity-0 transition-all duration-700 transform scale-75">
            <div class="relative flex items-center justify-center">
                <!-- Left glowing vertical guide line -->
                <div class="w-1 h-32 bg-gradient-to-b from-transparent via-pink-400 to-transparent rounded-full shadow-[0_0_15px_rgba(244,63,94,0.6)] mr-8"></div>
                
                <!-- Center Glowing Heart Icon -->
                <div id="mainHeart" class="text-pink-500 text-6xl filter drop-shadow-[0_0_25px_rgba(244,63,94,0.8)]">
                    ❤️
                </div>

                <!-- Right glowing vertical guide line -->
                <div class="w-1 h-32 bg-gradient-to-b from-transparent via-pink-400 to-transparent rounded-full shadow-[0_0_15px_rgba(244,63,94,0.6)] ml-8"></div>
            </div>
            
            <!-- Dynamic Floating Little Hearts Generator -->
            <div id="floatingHeartsArea" class="absolute inset-0 pointer-events-none"></div>
        </div>
    </div>

    <div class="mb-12 text-center z-10">
        <p id="hintText" class="text-sm font-light text-neutral-400 tracking-wide animate-pulse">
            Pull the cord to switch on
        </p>
    </div>

    <script>
        // DOM Element references
        const scene = document.getElementById('scene');
        const pullSwitch = document.getElementById('pullSwitch');
        const lampBulbContainer = document.getElementById('lampBulbContainer');
        const lightBulb = document.getElementById('lightBulb');
        const bulbFilament = document.getElementById('bulbFilament');
        const heartContainer = document.getElementById('heartContainer');
        const mainHeart = document.getElementById('mainHeart');
        const hintText = document.getElementById('hintText');
        const floatingHeartsArea = document.getElementById('floatingHeartsArea');

        let isOn = false;
        let animating = false;
        let heartInterval = null;

        // Function to start the romantic animations
        function startLove() {
            scene.classList.remove('scene-dark');
            scene.classList.add('scene-light');

            // Bulb ON effect
            lightBulb.classList.remove('bg-neutral-800', 'border-neutral-600');
            lightBulb.classList.add('bg-amber-300', 'border-amber-100');
            lightBulb.style.boxShadow = '0 0 50px rgba(251, 191, 36, 0.8), 0 0 100px rgba(251, 191, 36, 0.5)';
            
            bulbFilament.classList.remove('bg-neutral-600');
            bulbFilament.classList.add('bg-white', 'shadow-[0_0_10px_#fff]');

            // Show heart container with smooth animation
            heartContainer.classList.remove('opacity-0', 'scale-75');
            heartContainer.classList.add('opacity-100', 'scale-100');
            mainHeart.style.animation = 'pulseGlow 2s infinite ease-in-out';

            // Generate floating micro hearts periodically
            if (!heartInterval) {
                heartInterval = setInterval(createFloatingHeart, 400);
            }
        }

        // Function to stop the romantic animations
        function stopLove() {
            scene.classList.remove('scene-light');
            scene.classList.add('scene-dark');

            // Bulb OFF effect
            lightBulb.classList.add('bg-neutral-800', 'border-neutral-600');
            lightBulb.classList.remove('bg-amber-300', 'border-amber-100');
            lightBulb.style.boxShadow = 'none';

            bulbFilament.classList.add('bg-neutral-600');
            bulbFilament.classList.remove('bg-white', 'shadow-[0_0_10px_#fff]');

            // Hide heart container
            heartContainer.classList.add('opacity-0', 'scale-75');
            heartContainer.classList.remove('opacity-100', 'scale-100');
            mainHeart.style.animation = 'none';

            // Clear floating hearts
            if (heartInterval) {
                clearInterval(heartInterval);
                heartInterval = null;
            }
            floatingHeartsArea.innerHTML = '';
        }

        // Helper to spawn floating hearts upward
        function createFloatingHeart() {
            if (!isOn) return;
            const heart = document.createElement('div');
            heart.className = 'heart-float text-pink-400 text-sm';
            heart.innerText = Math.random() > 0.5 ? '💖' : '✨';
            
            // Random horizontal offset
            const randomX = (Math.random() - 0.5) * 80;
            heart.style.left = `calc(50% + ${randomX}px)`;
            heart.style.bottom = '20px';
            
            floatingHeartsArea.appendChild(heart);

            // Clean up DOM after animation completes
            setTimeout(() => {
                heart.remove();
            }, 2500);
        }

        // Event listener for pull switch interaction
        pullSwitch.addEventListener('click', () => {
            if (animating) return;
            animating = true;

            // Add pulling visual class
            lampBulbContainer.classList.add('pulling');
            
            isOn = !isOn;
            pullSwitch.setAttribute('aria-pressed', String(isOn));
            hintText.textContent = isOn ? 'Pull again to switch off' : 'Pull the cord to switch on';

            setTimeout(() => {
                if (isOn) {
                    startLove();
                } else {
                    stopLove();
                }
            }, 120);

            setTimeout(() => {
                lampBulbContainer.classList.remove('pulling');
                animating = false;
            }, 200);
        });

        // Touch support for mobile devices
        pullSwitch.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pullSwitch.click();
        });
    </script>
</body>
</html>
